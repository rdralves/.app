{% extends "base.html" %}
{% block content %}
<h3>Registrar Manutenção</h3>

<form method="post">
    <div class="row">
        <div class="col-md-4 mb-3">
            <label>Veículo</label>
            <select name="veiculo_id" class="form-select" required>
                <option value="">Selecione</option>
                {% for v in veiculos %}
                <option value="{{ v.id }}">{{ v.placa }} - {{ v.modelo }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label>Tipo</label>
            <select name="tipo" class="form-select" required>
                <option>Preventiva</option>
                <option>Corretiva</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label>Data</label>
            <input type="date" name="data" class="form-control" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label>Descrição</label>
            <input type="text" name="descricao" class="form-control" required>
        </div>
        <div class="col-md-3 mb-3">
            <label>Km realizada</label>
            <input type="number" name="km_realizada" class="form-control">
        </div>
        <div class="col-md-3 mb-3">
            <label>Custo (R$)</label>
            <input type="number" step="0.01" name="custo" class="form-control">
        </div>
    </div>

    <div class="row">
        <div class="col-md-3 mb-3">
            <label>Próxima manutenção (km)</label>
            <input type="number" name="proxima_km" class="form-control">
        </div>
        <div class="col-md-3 mb-3">
            <label>Próxima manutenção (data)</label>
            <input type="date" name="proxima_data" class="form-control">
        </div>
    </div>

    <button class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('manutencoes.listar_manutencoes') }}" class="btn btn-secondary">Voltar</a>
</form>
{% endblock %}
