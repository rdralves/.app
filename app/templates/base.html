<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cyberpunk App{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilo Cyberpunk Minimalista -->
    <style>
        body {
            background-color: #0f0f0f;
            color: #00ffea;
            font-family: 'Courier New', monospace;
        }

        .navbar {
            background-color: #121212;
            border-bottom: 2px solid #00ffea;
        }

        .navbar-brand,
        .nav-link {
            color: #00ffea !important;
            text-shadow: 0 0 5px #00ffea;
        }

        .nav-link:hover {
            color: #0f0f0f !important;
            background-color: #00ffea;
            border-radius: 5px;
        }

        .container {
            margin-top: 60px;
        }

        .neon-border {
            border: 2px solid #00ffea;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #00ffea;
        }

        .btn-outline-info {
            border-color: #00ffea;
            color: #00ffea;
        }

        .btn-outline-info:hover {
            background-color: #00ffea;
            color: #0f0f0f;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('bp_main.index') }}">Cyberpunk App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('bp_main.index') }}">Home</a>
                    </li>
                    {% if current_user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('bp_user.logout') }}">Logout</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('bp_user.login') }}">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('bp_user.register') }}">Register</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
